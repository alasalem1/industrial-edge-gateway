
# SentinelEdge Platform Layer

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "sentinel_edge"
BBFILE_PATTERN_sentinel_edge = "^${LAYERDIR}/"
BBFILE_PRIORITY_sentinel_edge = "6"

LAYERSERIES_COMPAT_sentinel_edge = "scarthgap"

LAYERDEPENDS_sentinel_edge = "core"
